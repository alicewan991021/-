<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#22201e">
<title>記憶重生</title>
<style>
:root{--bg:#171716;--panel:#242321;--panel2:#302e2a;--ink:#eee9df;--muted:#aaa397;--gold:#c9ad7c;--line:#514b42;--red:#a75b51}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;min-height:100vh}button{font:inherit;color:inherit;border:1px solid var(--line);background:#35322d;border-radius:12px;padding:11px 14px;cursor:pointer}button:active{transform:scale(.98)}button:disabled{opacity:.35;cursor:not-allowed}.hidden{display:none!important}
#app{max-width:980px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.screen{padding:22px;flex:1}.eyebrow{letter-spacing:.2em;color:var(--gold);font-size:11px}.title{font-family:serif;font-size:clamp(42px,9vw,76px);letter-spacing:.14em;margin:12px 0 4px;font-weight:400}.subtitle{color:#c4bcb0;letter-spacing:.24em;font-size:12px}.rule{height:1px;background:var(--line);margin:22px 0}.muted{color:var(--muted);line-height:1.8}.primary{background:var(--gold);color:#211e19;border:0;font-weight:700}.wide{width:100%}
#titleScreen{display:flex;flex-direction:column;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 42%,#39352e 0,#211f1c 43%,#171716 78%);text-align:center}#titleScreen .title{margin-top:28px}#titleScreen .tagline{max-width:430px;margin:22px auto 42px;line-height:2;color:#c9c1b5}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#1d1c1a;position:sticky;top:0;z-index:5}#topbar strong{letter-spacing:.12em}#topbar small{color:var(--muted)}.top-actions{display:flex;gap:6px}.top-actions button{padding:8px 10px;font-size:12px}
#gameScreen{padding:14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);gap:14px;align-content:start}.scene-card,.side-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.scene-head{padding:16px 18px;border-bottom:1px solid var(--line)}.scene-head h2{font-weight:500;margin:4px 0;font-size:22px}.scene-head p{margin:0;color:var(--muted);font-size:13px}.room{position:relative;min-height:360px;padding:18px;background-color:#39352f;background-image:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:10px}.room:before{content:"";position:absolute;inset:10px;border:1px solid #62594c;pointer-events:none}.object{z-index:1;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#292723d9;border:1px solid #655b4d;border-radius:12px;padding:8px;text-align:center;font-size:12px}.object .symbol{font-size:26px;filter:grayscale(.35)}.object.near{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.object.done{border-color:#77715f}.player-token{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;font-size:24px;filter:drop-shadow(0 2px 3px #111);pointer-events:none}.room-note{padding:10px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.side-card{padding:16px}.side-card h3{font-size:15px;margin:0 0 10px;color:var(--gold);font-weight:600}.narrative{font-family:serif;font-size:15px;line-height:1.95;white-space:pre-line;color:#e6dfd3;min-height:120px}.action-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.action-list button{font-size:12px}.side-section{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}.side-section p{font-size:12px;color:var(--muted);line-height:1.7;margin:6px 0}.controls{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:5px;justify-content:center;margin-top:10px}.controls button{padding:0;border-radius:9px;font-size:18px}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}
#modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.modal-card{width:min(560px,100%);max-height:88vh;overflow:auto;background:#262420;border:1px solid #74664f;border-radius:18px;padding:20px;box-shadow:0 20px 80px #0009}.modal-card h2{font-family:serif;font-weight:400;margin:0 0 12px;font-size:25px}.modal-card p{line-height:1.9;color:#d2cabe;white-space:pre-line}.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.gear-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.gear{padding:12px 4px;text-align:center;background:#37332c}.gear b{display:block;font-size:26px;color:var(--gold);font-weight:500}.gear small{font-size:10px;color:var(--muted)}.gear button{width:100%;margin-top:8px;padding:7px 0}.clue{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#302d28}.clue small{display:block;color:var(--gold);margin-bottom:5px}.clue p{margin:0;font-size:13px}.journal-list{padding-left:20px;line-height:1.9;color:#d4cbbd;font-size:13px}
#introScreen{max-width:650px;margin:auto;padding-top:10vh}.intro-text{font-family:serif;font-size:17px;line-height:2.1;white-space:pre-line;color:#e8e0d4}.intro-actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
@media(max-width:700px){#gameScreen{grid-template-columns:1fr;padding:10px}.room{min-height:330px;gap:7px;padding:14px}.object{min-height:76px;font-size:11px}.side-card{padding:14px}.narrative{min-height:90px}#topbar{padding:10px 12px}.screen{padding:16px}.title{font-size:48px}}
</style>
</head>
<body>
<div id="app">
<section id="titleScreen" class="screen">
<div class="eyebrow">INTERACTIVE STORY · MYSTERY ADVENTURE</div>
<h1 class="title">記憶重生</h1>
<div class="subtitle">有些人忘了，有些事還在。</div>
<p class="tagline">一場關於記憶、生活與愛的探索。<br>當熟悉的家開始變得陌生，你還能相信什麼？</p>
<button class="primary" id="startBtn">開始遊戲</button>
<button id="continueBtn" style="margin-top:10px;display:none">繼續上次進度</button>
<div class="muted" style="font-size:11px;margin-top:34px">第一版測試版 · 序章／臥室／廁所</div>
</section>
<section id="introScreen" class="screen hidden">
<div class="eyebrow">PROLOGUE · 雨夜之後</div>
<h2 style="font-family:serif;font-size:30px;font-weight:400">醒來的時候，雨還沒停。</h2>
<div class="intro-text" id="introText"></div>
<div class="intro-actions"><button class="primary" id="enterHouse">走進房間</button><button id="backTitle">返回標題</button></div>
</section>
<div id="topbar" class="hidden">
<div><strong>記憶重生</strong><br><small id="roomLabel">臥室</small></div>
<div class="top-actions"><button id="journalBtn">筆記本</button><button id="saveBtn">存檔</button><button id="menuBtn">選單</button></div>
</div>
<section id="gameScreen" class="hidden">
<div class="scene-card">
<div class="scene-head"><div class="eyebrow" id="chapterLabel">CHAPTER 01</div><h2 id="roomTitle">臥室</h2><p id="roomSub">暴雨清晨 · 頭痛欲裂</p></div>
<div class="room" id="roomMap"></div>
<div class="room-note">靠近物品後按「互動」，也可以直接點選物品；手機可使用方向鍵。</div>
</div>
<aside class="side-card">
<h3 id="panelTitle">醒來</h3>
<div class="narrative" id="narrative"></div>
<div class="action-list" id="actionList"></div>
<div class="side-section"><h3>移動</h3><div class="controls"><button class="up" data-move="0,-1">↑</button><button class="left" data-move="-1,0">←</button><button class="down" data-move="0,1">↓</button><button class="right" data-move="1,0">→</button></div><p style="text-align:center">也可使用鍵盤方向鍵或 WASD</p></div>
<div class="side-section"><h3>隨身狀態</h3><p id="statusText">頭痛：劇烈　｜　體力：疲憊</p><p id="clueCount">已整理的發現：0</p></div>
</aside>
</section>
</div>
<div id="modal" class="hidden"><div class="modal-card" id="modalCard"></div></div>
<script>
const $=id=>document.getElementById(id);
const defaultState={scene:'title',room:'bedroom',x:1,y:2,gear:[3,2,4,6],gearSolved:false,drawerOpen:false,washed:[],steamed:false,mirrorSeen:false,bathClues:[],clues:[],notes:[],history:[],bathUnlocked:false};
let S=loadState()||structuredClone(defaultState);
const rooms={
bedroom:{title:'臥室',sub:'暴雨清晨 · 頭痛欲裂',chapter:'CHAPTER 01',objects:[
{id:'bed',name:'床沿',symbol:'▱',x:0,y:0},
{id:'pillow',name:'枕頭',symbol:'▰',x:1,y:0},
{id:'clock',name:'舊機械鐘',symbol:'◷',x:2,y:0},
{id:'nightstand',name:'床頭櫃',symbol:'▤',x:3,y:0},
{id:'window',name:'窗戶',symbol:'▥',x:0,y:1},
{id:'closet',name:'衣櫃',symbol:'▥',x:3,y:1},
{id:'notebook',name:'隨身筆記本',symbol:'▧',x:1,y:2},
{id:'door',name:'房門',symbol:'⇥',x:3,y:2}]},
bathroom:{title:'廁所',sub:'洗手台前 · 鏡面蒙著水痕',chapter:'CHAPTER 02',objects:[
{id:'sink',name:'洗手台',symbol:'♧',x:0,y:0},
{id:'mirror',name:'浴室鏡子',symbol:'▣',x:1,y:0},
{id:'cabinet',name:'洗手台下櫃',symbol:'▤',x:2,y:0},
{id:'towel',name:'毛巾架',symbol:'▱',x:3,y:0},
{id:'shower',name:'蓮蓬頭',symbol:'♨',x:0,y:1},
{id:'shelf',name:'浴室收納架',symbol:'▥',x:2,y:1},
{id:'door',name:'回臥室',symbol:'⇥',x:3,y:2}]}
};
const objectDone=new Set();
let activeObject=null;
function loadState(){try{return JSON.parse(localStorage.getItem('memoryRebirthSave'))}catch(e){return null}}
function save(){S.scene='play';localStorage.setItem('memoryRebirthSave',JSON.stringify(S));toast('進度已儲存在這台裝置。')}
function toast(t){$('panelTitle').textContent='記錄';$('narrative').textContent=t;$('actionList').innerHTML=''}
function addClue(id,text){if(!S.clues.some(c=>c.id===id)){S.clues.push({id,text});S.notes.push(text);$('clueCount').textContent='已整理的發現：'+S.clues.length;}}
function addHistory(t){S.history.push(t)}
function showModal(title,body,buttons=[]){$('modalCard').innerHTML='<h2>'+title+'</h2><p>'+body+'</p><div class="modal-actions" id="modalActions"></div>';buttons.forEach(b=>{let x=document.createElement('button');x.textContent=b.label;x.className=b.primary?'primary':'';x.onclick=b.fn;$('modalActions').appendChild(x)});let close=document.createElement('button');close.textContent='關閉';close.onclick=closeModal;$('modalActions').appendChild(close);$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function setNarrative(title,text,actions=[]){$('panelTitle').textContent=title;$('narrative').textContent=text;$('actionList').innerHTML='';actions.forEach(a=>{let b=document.createElement('button');b.textContent=a.label;b.className=a.primary?'primary':'';b.onclick=a.fn;$('actionList').appendChild(b)})}
function startIntro(){$('titleScreen').classList.add('hidden');$('introScreen').classList.remove('hidden');$('introText').textContent='頭痛像有人拿鐵鎚敲著太陽穴。\\n\\n林敬偉在床上睜開眼，窗外的雨聲密得像一面牆。喉嚨乾得發苦，胃裡空空的，手腳卻冷得不像自己的。\\n\\n他下意識把手伸向枕頭底下。\\n\\n空的。\\n\\n「幹，恁爸這是被做掉了嗎？」\\n\\n房間很熟悉。至少，他認為自己熟悉。只是有些東西的位置，好像跟記憶裡不太一樣。');}
function enterGame(){S.scene='play';S.room='bedroom';$('introScreen').classList.add('hidden');$('topbar').classList.remove('hidden');$('gameScreen').classList.remove('hidden');renderRoom();setNarrative('醒來','頭痛一陣一陣往上衝。先確認自己在哪裡，再想辦法讓身體舒服一點。\\n\\n枕頭底下空空的。窗外還在下雨。', [{label:'查看房間',fn:()=>setNarrative('房間','床、床頭櫃、衣櫃、窗戶……每樣東西都在原本的位置嗎？你可以自由走動，也可以直接點選物品。')}]);}
function renderRoom(){let room=rooms[S.room];$('roomLabel').textContent=room.title;$('roomTitle').textContent=room.title;$('roomSub').textContent=room.sub;$('chapterLabel').textContent=room.chapter;let map=$('roomMap');map.innerHTML='';room.objects.forEach(o=>{let b=document.createElement('button');b.className='object'+(objectDone.has(o.id)?' done':'');b.style.gridColumn=(o.x+1);b.style.gridRow=(o.y+1);b.innerHTML='<span class="symbol">'+o.symbol+'</span><span>'+o.name+'</span>';b.onclick=()=>interact(o.id);map.appendChild(b)});let p=document.createElement('div');p.className='player-token';p.textContent='♟';p.style.left=(12+S.x*23)+'%';p.style.top=(12+S.y*27)+'%';p.style.bottom='auto';map.appendChild(p);$('clueCount').textContent='已整理的發現：'+S.clues.length}
function move(dx,dy){S.x=Math.max(0,Math.min(3,S.x+dx));S.y=Math.max(0,Math.min(2,S.y+dy));renderRoom();let nearby=rooms[S.room].objects.find(o=>Math.abs(o.x-S.x)+Math.abs(o.y-S.y)<=1);if(nearby)setNarrative('附近物品',nearby.name+'就在附近。可以點選它進行互動。')}
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [x,y]=b.dataset.move.split(',').map(Number);move(x,y)});
document.addEventListener('keydown',e=>{if($('modal').classList.contains('hidden')&&$('gameScreen').classList.contains('hidden')===false){let k=e.key.toLowerCase();if(['arrowup','w'].includes(k))move(0,-1);if(['arrowdown','s'].includes(k))move(0,1);if(['arrowleft','a'].includes(k))move(-1,0);if(['arrowright','d'].includes(k))move(1,0);if(k==='e'&&activeObject)interact(activeObject)}});
function interact(id){activeObject=id;let room=S.room;
if(room==='bedroom'){
if(id==='pillow'){addClue('bed_pillow','枕頭底下空無一物。敬偉原本習慣把重要的東西放在這裡，但現在什麼也摸不到。');setNarrative('枕頭底下','手指摸過枕頭下方，只有冰冷的床板。\\n\\n「我的東西呢？」他皺起眉，胸口那股不安來得毫無道理，卻又真實得讓人無法忽略。',[{label:'再摸一次',fn:()=>setNarrative('枕頭底下','還是空的。你不確定自己是不是記錯了。')}]);}
if(id==='bed'){showModal('床沿','身體沉得像灌了鉛。頭痛沒有消失，只是躺著時稍微沒那麼尖銳。',[{label:'坐下休息',primary:true,fn:()=>{setNarrative('短暫休息','你坐在床沿，等那陣暈眩稍微退去。身體仍然疲憊。');closeModal()}}]);}
if(id==='clock'){showModal('舊機械鐘','床頭的機械鐘停在凌晨。後蓋有四枚連動齒輪，齒輪旁刻著「轉動一枚，下一枚會反向跟著走」。\\n\\n要讓四個數字回到正確位置，先找出它們要對應的日期。',[{label:'檢查齒輪',primary:true,fn:()=>{closeModal();gearPuzzle()}}]);}
if(id==='nightstand'){showModal('床頭櫃','抽屜卡住了，像是裡面有機關。櫃面有一圈長年摩擦留下的痕跡。',[{label:'查看抽屜機關',fn:()=>{closeModal();gearPuzzle()}}]);}
if(id==='window'){addClue('bed_window','窗外雨勢很大。玻璃映出房間裡的輪廓，敬偉一瞬間覺得房內似乎還有另一個人，回頭卻只看見空蕩蕩的床。');setNarrative('窗戶','雨水沿著玻璃往下滑。窗上的倒影讓你以為身後有人。\\n\\n你回過頭，房間裡只有自己。');}
if(id==='closet'){addClue('bed_closet','衣櫃裡掛著整齊的黑色衣物，最外側衣架卻空著，像是有人剛取走一件衣服。');setNarrative('衣櫃','黑色衣物依照長短排列。最外側留著一個空衣架，衣架上掛著一小段淺色毛線。');}
if(id==='notebook'){showJournal();}
if(id==='door'){S.room='bathroom';S.x=1;S.y=2;renderRoom();setNarrative('走進廁所','頭痛讓你想洗把臉清醒一下。你扶著牆走進廁所，鏡面有些水痕，洗手台上放著日常用品。');}
}
if(room==='bathroom'){
if(id==='sink'){showModal('洗手台','水龍頭的金屬把手有冷凝的水珠。你可以自由梳洗，不必照固定順序。',[{label:'洗臉',fn:()=>wash('洗臉')},{label:'刷牙',fn:()=>wash('刷牙')},{label:'刮鬍子',fn:()=>wash('刮鬍子')},{label:'用冷水漱口',fn:()=>wash('漱口')},{label:'轉開熱水',primary:true,fn:()=>{closeModal();steam()}}]);}
if(id==='mirror'){if(!S.steamed){addClue('bath_redmark','鏡子角落有紅色奇異筆留下的筆畫，像是有人寫到一半又停下。字跡被擦過，無法辨認完整內容。');setNarrative('浴室鏡子','鏡面角落有幾道紅色筆畫。你靠近看，筆跡似乎被擦拭過，留下斷斷續續的痕跡。\\n\\n這是誰寫的？');}else{S.mirrorSeen=true;addClue('bath_mist','熱水蒸氣讓鏡面浮出另一層痕跡：幾個被刻意避開水氣的區域，組成一段不完整的提醒：「先確認今天，再相信眼前。」');setNarrative('水霧中的鏡子','鏡面逐漸起霧。原本看不清的地方，反而留下幾塊乾燥的區域。\\n\\n像是有人曾經在這裡寫過字，又刻意把某些地方擦乾淨。\\n\\n「先確認今天，再相信眼前。」');}}
if(id==='cabinet'){if(S.mirrorSeen){addClue('bath_cabinet','洗手台下櫃裡有兩支不同款式的牙刷替換頭，旁邊還有一張被撕掉一半的紙條。');showModal('洗手台下櫃','櫃門沒有上鎖，只是卡得很緊。裡面有兩支不同款式的牙刷替換頭，還有一張撕裂的紙條。\\n\\n紙條殘留：「……出入時間……不要讓他知道……」',[{label:'把紙條收進筆記',fn:()=>{addClue('bath_fragment','紙條殘留「出入時間」「不要讓他知道」等字句，無法判斷是在提醒、監視，還是另一種意思。');setNarrative('撕裂的紙條','字跡沒有署名。你無法確定它是在記錄誰，也不知道它為什麼會出現在家裡。');closeModal()}}]);}else setNarrative('洗手台下櫃','櫃門卡住了。你先處理鏡子上的痕跡，或許能看出這個空間裡還有什麼被忽略。');}
if(id==='towel'){addClue('bath_towel','毛巾架上有兩條毛巾。一條摺得整齊，另一條還濕著，像剛有人用過。');setNarrative('毛巾架','兩條毛巾。一條整整齊齊，另一條濕了一角。你伸手碰了碰，水還沒乾。');}
if(id==='shower'){setNarrative('蓮蓬頭','你轉開蓮蓬頭，水聲填滿狹小的空間。水流打在磁磚上，頭痛仍在，沒有因為水聲而消失。');}
if(id==='shelf'){addClue('bath_shelf','收納架上有一瓶剃鬍泡沫，瓶身貼著一張小紙：「不要再刮傷自己了。」字跡與鏡面上的紅色筆跡不同。');setNarrative('浴室收納架','剃鬍泡沫旁貼著一張小紙：「不要再刮傷自己了。」\\n\\n語氣熟稔得像是說過很多次。');}
if(id==='door'){S.room='bedroom';S.x=2;S.y=2;renderRoom();setNarrative('回到臥室','你擦乾手，回到臥室。雨聲還在，頭痛也還在。');}
}
}
function wash(action){closeModal();if(!S.washed.includes(action))S.washed.push(action);let lines={'洗臉':'冷水碰上臉頰，刺得你縮了一下。視線清楚了一點，頭痛卻沒有退。','刷牙':'牙刷旁邊似乎還有另一支。你盯著它看了幾秒，卻想不起來那支是誰的。','刮鬍子':'剃鬍刀滑過下巴，你下意識放慢動作。鏡子裡的自己看起來比記憶中疲憊。','漱口':'水的味道有點鐵鏽味。你吐掉漱口水，胃裡仍然空得發疼。'};if(action==='刷牙')addClue('bath_brush','洗手台旁有兩支牙刷，其中一支刷毛已經散開。你不記得自己什麼時候開始準備兩支。');setNarrative(action,lines[action]+'\\n\\n已完成的梳洗：'+S.washed.join('、')+'。',[{label:'繼續梳洗',fn:()=>interact('sink')},{label:'看看鏡子',fn:()=>interact('mirror')}]);}
function steam(){S.steamed=true;setNarrative('熱水與水霧','你把洗手台的熱水開到最大。溫熱的水氣慢慢往上爬，鏡面從邊緣開始蒙白。\\n\\n水霧沒有讓所有字浮出來，反而讓某些被擦過的痕跡變得明顯。',[{label:'查看鏡子',primary:true,fn:()=>interact('mirror')}]);}
function gearPuzzle(){showModal('連動齒輪','每轉動一枚齒輪，它右側的下一枚就會反向轉動一格。請依照刻在金屬牌上的入會日期，將四枚齒輪調整成正確數字。\\n\\n提示：金屬牌刻著 2021.05.18。四個數字依序對應月、日。',[{label:'開始調整',primary:true,fn:()=>{closeModal();renderGears()}}]);}
function renderGears(){let card=$('modalCard');card.innerHTML='<h2>舊機械鐘</h2><p>點擊齒輪轉動。每枚齒輪會帶動右側齒輪反向轉動。目標：05／18。</p><div class="gear-row">'+S.gear.map((n,i)=>'<div class="gear"><small>齒輪 '+(i+1)+'</small><b>'+n+'</b><button data-gear="'+i+'">轉動 ↻</button></div>').join('')+'</div><p style="font-size:12px;color:#aaa397">目前排列：'+S.gear.join('')+'</p><div class="modal-actions"><button id="checkGear" class="primary">確認機關</button><button id="resetGear">重置</button><button id="closeGear">稍後再試</button></div>';$('modal').classList.remove('hidden');card.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.gear);S.gear[i]=(S.gear[i]+1)%10;if(i<3)S.gear[i+1]=(S.gear[i+1]+9)%10;renderGears()});$('checkGear').onclick=()=>{if(S.gear.join('')==='0518'){S.gearSolved=true;S.drawerOpen=true;closeModal();addClue('bed_clock','機械鐘的四枚齒輪終於對齊。暗格彈開，裡面沒有槍，只有一張提醒吃藥的便利貼。');showModal('暗格彈開','齒輪發出沉悶的喀噠聲。床頭櫃的暗格滑了出來。\\n\\n裡面沒有槍，只有一張便利貼：\\n\\n「敬偉，頭痛記得吃藥！不要在那邊硬撐！」\\n\\n字跡熟悉，卻讓你一時想不起寫字的人。',[{label:'收下便利貼',primary:true,fn:()=>{addClue('bed_note','便利貼寫著：「敬偉，頭痛記得吃藥！不要在那邊硬撐！」沒有署名。');S.bathUnlocked=true;setNarrative('暗格裡的便利貼','你把便利貼收進筆記本。腦中閃過一個模糊的雨夜，槍聲、灼熱、有人在遠處喊你的名字。\\n\\n「還沒帶那小鬼去吃夜市……」\\n\\n你分不清那是記憶，還是剛才才冒出的念頭。');closeModal();renderRoom()}}]);}else{showModal('齒輪仍然卡住','機械鐘發出一聲空響。齒輪沒有完全咬合。你可以再試一次，不會因此失去任何線索。',[{label:'繼續調整',primary:true,fn:()=>{closeModal();renderGears()}}]);}};$('resetGear').onclick=()=>{S.gear=[3,2,4,6];renderGears()};$('closeGear').onclick=closeModal;}
function showJournal(){let text=S.notes.length?S.notes.map((n,i)=>(i+1)+'. '+n).join('\\n\\n'):'目前還沒有整理任何發現。';showModal('敬偉的筆記本','這本筆記只有敬偉自己留下的紀錄。\\n\\n'+text,[{label:'新增備忘：確認今天日期',fn:()=>{S.notes.push('先確認今天日期。不要只相信第一眼看到的東西。');closeModal();setNarrative('筆記本','你在空白處寫下：「先確認今天日期。不要只相信第一眼看到的東西。」')} }]);}
$('journalBtn').onclick=showJournal;$('saveBtn').onclick=save;$('menuBtn').onclick=()=>showModal('遊戲選單','進度會保存在目前使用的瀏覽器。清除瀏覽器資料可能會讓存檔消失。',[{label:'儲存進度',primary:true,fn:()=>{save();closeModal()}},{label:'回到標題',fn:()=>{closeModal();$('gameScreen').classList.add('hidden');$('topbar').classList.add('hidden');$('titleScreen').classList.remove('hidden')}}]);
$('startBtn').onclick=startIntro;$('continueBtn').onclick=()=>{if(S.scene==='play'){ $('titleScreen').classList.add('hidden');$('topbar').classList.remove('hidden');$('gameScreen').classList.remove('hidden');renderRoom();setNarrative('繼續探索','你回到了離開前的地方。');}else startIntro()};
$('enterHouse').onclick=enterGame;$('backTitle').onclick=()=>{$('introScreen').classList.add('hidden');$('titleScreen').classList.remove('hidden')};
if(localStorage.getItem('memoryRebirthSave'))$('continueBtn').style.display='block';
if(S.scene==='play'){$('continueBtn').style.display='block'}
</script>
</body>
</html>
