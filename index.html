<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>記憶重生</title>
<style>
:root{--ink:#393832;--muted:#777469;--paper:#f3eee5;--line:#d5cbbb;--accent:#8d7354;--shadow:0 14px 40px #40382b22}
*{box-sizing:border-box}body{margin:0;background:#e8e1d6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button{font:inherit;color:inherit;cursor:pointer}#app{max-width:1200px;margin:auto;min-height:100svh;background:#f5f1e9;box-shadow:0 0 50px #534b3d18}.hidden{display:none!important}
header{height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#f8f5ef;position:sticky;top:0;z-index:5}header strong{letter-spacing:.16em;font-family:serif;font-size:17px}header .tools{display:flex;gap:8px}header button,.plain{border:1px solid var(--line);background:#fffaf2;border-radius:9px;padding:8px 12px;font-size:13px}
#title{min-height:calc(100svh - 58px);display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(160deg,#e5ddd0,#f5f0e7 56%,#d5d0c6)}.title-inner{max-width:550px}.title-kicker{font-size:11px;letter-spacing:.3em;color:#8b7961}.title-name{font-family:serif;font-size:clamp(48px,9vw,82px);font-weight:400;letter-spacing:.18em;margin:14px 0 6px}.title-sub{letter-spacing:.22em;color:#766f63;font-size:12px}.title-desc{line-height:2;color:#655f55;margin:30px auto;max-width:390px}.primary{background:#776448!important;color:white!important;border-color:#776448!important}.title button{min-width:190px;border:1px solid #8f7a5d;border-radius:8px;padding:13px 22px;background:#fffaf2}
#game{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px}.scene-panel,.side{background:#fffdf8;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}.scene-heading{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;gap:10px}.chapter{font-size:10px;letter-spacing:.2em;color:#9b8261}.scene-heading h1{font:400 23px serif;margin:4px 0 0}.scene-heading p{font-size:12px;color:var(--muted);margin:0}.scene-wrap{position:relative;width:100%;aspect-ratio:16/10;background:#d9d0c2;overflow:hidden}.scene-art{width:100%;height:100%;display:block}.hotspot{position:absolute;border:0;background:transparent;border-radius:9px;outline:1px solid transparent;transition:background .15s,outline .15s}.hotspot:focus-visible,.hotspot:hover{background:#fff7e344;outline:2px solid #fff4d2}.hotspot span{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:#fffaf0e8;padding:3px 8px;border-radius:5px;opacity:0;transition:opacity .15s}.hotspot:hover span,.hotspot:focus-visible span{opacity:1}.scene-caption{padding:10px 15px;color:#777165;font-size:11px;border-top:1px solid var(--line)}
.side{padding:17px;display:flex;flex-direction:column;gap:14px}.side h2{font:400 19px serif;margin:0}.story{font:15px/1.95 serif;white-space:pre-line;color:#514d44;min-height:125px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button,.side button{border:1px solid var(--line);background:#f7f2e9;border-radius:8px;padding:9px 11px;font-size:12px}.side button.primary{background:#776448;border-color:#776448}.divider{height:1px;background:#e6ded1}.side-note{font-size:12px;line-height:1.7;color:#777165}.side-note strong{color:#665741}
#modal{position:fixed;inset:0;background:#26231dcc;z-index:20;display:grid;place-items:center;padding:14px}.modal-card{width:min(680px,100%);max-height:92svh;overflow:auto;background:#f8f4ec;border-radius:13px;box-shadow:0 25px 80px #0005;border:1px solid #d6c9b7}.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font:400 23px serif;margin:0}.modal-head button{border:0;background:transparent;font-size:22px}.modal-body{padding:18px 20px;line-height:1.9}.modal-body p{margin:0 0 12px}.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.modal-actions button{border:1px solid var(--line);background:#fffaf2;border-radius:8px;padding:9px 13px}.modal-actions .primary{background:#776448;border-color:#776448}
.gears{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.gear{background:#ebe4d8;border:1px solid #d4c7b5;border-radius:10px;text-align:center;padding:12px 6px}.gear-wheel{width:64px;height:64px;border-radius:50%;border:7px dotted #9c8a6f;display:grid;place-items:center;margin:0 auto 8px;background:radial-gradient(circle,#f7f0e3 0 28%,#c6b69c 30% 40%,#e7ddcd 42%)}.gear-wheel b{font:22px serif}.gear small{font-size:10px;color:#807563}.gear button{margin-top:8px;width:100%;padding:7px;border:1px solid #c9bba7;background:#fffaf2;border-radius:7px}
input.code{font-size:24px;letter-spacing:.35em;text-align:center;width:190px;padding:10px;border:1px solid #c9bba7;border-radius:8px;background:white;color:#393832}
.journal{white-space:pre-line;font-size:13px;line-height:1.9;color:#5e594f}.journal li{margin:0 0 10px}
@media(max-width:780px){#game{grid-template-columns:1fr;padding:10px}.scene-wrap{aspect-ratio:4/3}.side{padding:14px}.story{min-height:80px}header{padding:0 12px}.scene-heading{padding:12px 14px}.scene-heading h1{font-size:20px}.gears{gap:5px}.gear{padding:9px 3px}.gear-wheel{width:52px;height:52px}.gear button{font-size:11px}}
@media(max-width:390px){.gears{grid-template-columns:repeat(2,1fr)}.scene-wrap{aspect-ratio:1/1}}
</style>

<body><div id="app">
<header id="header" class="hidden"><strong>記憶重生</strong><div class="tools"><button id="journalBtn">筆記本</button><button id="saveBtn">存檔</button><button id="menuBtn">選單</button></div></header>
<section id="title"><div class="title-inner"><div class="title-kicker">A STORY OF MEMORY AND LOVE</div><div class="title-name">記憶重生</div><div class="title-sub">有些人忘了，有些事還在。</div><p class="title-desc">一個熟悉的家，一段逐漸模糊的生活。<br>當記憶開始出現落差，你還能相信眼前的一切嗎？</p><button class="primary" id="startBtn">開始探索</button><p class="title-kicker" style="margin-top:25px">2D 點擊探索測試版 · 臥室／浴室</p></div></section>
<section id="game" class="hidden"><div class="scene-panel"><div class="scene-heading"><div><div class="chapter" id="chapter">CHAPTER 01</div><h1 id="roomTitle">臥室</h1></div><p id="roomSub">雨天清晨 · 06:18</p></div><div class="scene-wrap" id="sceneWrap"></div><div class="scene-caption" id="sceneCaption">點擊場景中的物件進行調查。部分物件可以進入近距離觀察。</div></div><aside class="side"><h2 id="panelTitle">醒來</h2><div class="story" id="story"></div><div class="actions" id="actions"></div><div class="divider"></div><div><div class="chapter">探索紀錄</div><p class="side-note" id="progress">已發現線索：0</p><p class="side-note">點擊物件探索，不需要人物移動或方向鍵。</p></div></aside></section>
</div><div id="modal" class="hidden"><div class="modal-card" id="modalCard"></div></div>
<script>
const $=id=>document.getElementById(id);
const initial={room:"bedroom",gear:[3,2,4,6],gearSolved:false,drawerOpen:false,steam:false,redSeen:false,notes:[],clues:[],mirrorSolved:false};
let S=load()||structuredClone(initial);
function load(){try{return JSON.parse(localStorage.getItem("memoryRebirthVisual"))}catch(e){return null}}
function persist(){localStorage.setItem("memoryRebirthVisual",JSON.stringify(S))}
function say(title,text,actions=[]){$("panelTitle").textContent=title;$("story").textContent=text;$("actions").innerHTML="";actions.forEach(a=>{const b=document.createElement("button");b.textContent=a.label;if(a.primary)b.className="primary";b.onclick=a.fn;$("actions").appendChild(b)})}
function clue(id,text){if(!S.clues.some(x=>x.id===id)){S.clues.push({id,text});S.notes.push(text);$("progress").textContent="已發現線索："+S.clues.length;persist()}}
function modal(title,body,actions=[]){$("modalCard").innerHTML='<div class="modal-head"><h2>'+title+'</h2><button id="closeModal" aria-label="關閉">×</button></div><div class="modal-body" id="modalBody"></div>';$("modal").classList.remove("hidden");$("modalBody").append(body);const row=document.createElement("div");row.className="modal-actions";actions.forEach(a=>{const b=document.createElement("button");b.textContent=a.label;if(a.primary)b.className="primary";b.onclick=a.fn;row.append(b)});$("modalBody").append(row);$("closeModal").onclick=closeModal}
function closeModal(){$("modal").classList.add("hidden")}
const bedroomArt=`<svg class="scene-art" viewBox="0 0 960 600" role="img" aria-label="雨天清晨的臥室"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#d8d1c4"/><stop offset="1" stop-color="#c8c0b2"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#aa9278"/><stop offset="1" stop-color="#806d5a"/></linearGradient><linearGradient id="window" x2="1" y2="1"><stop stop-color="#9eabb0"/><stop offset="1" stop-color="#657983"/></linearGradient><linearGradient id="blanket" x2="0" y2="1"><stop stop-color="#e6dfd2"/><stop offset="1" stop-color="#bdb4a6"/></linearGradient></defs><rect width="960" height="600" fill="url(#wall)"/><path d="M0 430H960V600H0Z" fill="url(#floor)"/><path d="M0 430H960" stroke="#8e806e" stroke-width="5"/><rect x="75" y="65" width="260" height="250" rx="4" fill="#756e63"/><rect x="86" y="76" width="238" height="228" fill="url(#window)"/><path d="M205 76V304M86 190H324" stroke="#e0d9cb" stroke-width="9"/><g stroke="#dce4e4" stroke-width="3" opacity=".55"><path d="M110 90l-18 62m65-50-17 65m112-62-18 72m54-54-16 66M125 210l-18 55m80-60-14 63m103-61-16 60"/></g><path d="M55 54H355V80H55Z" fill="#9c8b74"/><path d="M370 0V430" stroke="#b4aa9b" stroke-width="4"/><rect x="440" y="90" width="440" height="20" fill="#9b8b75"/><rect x="460" y="110" width="395" height="175" rx="3" fill="#d5cbbd"/><rect x="480" y="128" width="355" height="140" fill="#e5ded2"/><path d="M480 198H835" stroke="#b9ad9c" stroke-width="2"/><rect x="570" y="142" width="130" height="92" fill="#a9a18f"/><rect x="580" y="152" width="110" height="72" fill="#e9e2d6"/><path d="M0 455H960" stroke="#6f5e4c" stroke-width="3"/><rect x="210" y="330" width="500" height="190" rx="12" fill="#75685a"/><rect x="225" y="305" width="470" height="190" rx="12" fill="#8d7d6b"/><path d="M235 350Q455 300 685 352V490H235Z" fill="url(#blanket)"/><path d="M250 370Q345 325 430 365L415 420Q325 400 250 425Z" fill="#f0e9dc"/><path d="M450 365Q565 325 680 370V490H450Z" fill="#c7bcae"/><path d="M235 480Q450 500 690 480" fill="none" stroke="#a89d8d" stroke-width="4"/><rect x="730" y="365" width="130" height="150" rx="5" fill="#806d58"/><rect x="742" y="378" width="106" height="53" fill="#a38e72"/><rect x="742" y="441" width="106" height="60" fill="#a38e72"/><circle cx="795" cy="406" r="4" fill="#e0d0b3"/><circle cx="795" cy="470" r="4" fill="#e0d0b3"/><rect x="763" y="338" width="65" height="24" rx="3" fill="#d7cbb8"/><circle cx="795" cy="350" r="11" fill="#9d8c70"/><path d="M795 350l0-7m0 7 6 3" stroke="#f4ead7" stroke-width="2"/><rect x="875" y="170" width="45" height="270" fill="#a28e75"/><path d="M883 185H910M883 205H910M883 225H910" stroke="#d7c9b4" stroke-width="4"/><rect x="70" y="350" width="105" height="80" rx="5" fill="#a38f77"/><path d="M85 365H160V415H85Z" fill="#c9bda9"/><path d="M0 550H960" stroke="#6e5b49" stroke-width="3"/><ellipse cx="465" cy="535" rx="250" ry="22" fill="#4b4137" opacity=".18"/></svg>`;
const bathArt=`<svg class="scene-art" viewBox="0 0 960 600" role="img" aria-label="自然光下的居家浴室"><defs><linearGradient id="btile" x2="0" y2="1"><stop stop-color="#e2e3dc"/><stop offset="1" stop-color="#c9cec6"/></linearGradient><linearGradient id="mirror" x2="0" y2="1"><stop stop-color="#c5d0cf"/><stop offset="1" stop-color="#e5e8e2"/></linearGradient><linearGradient id="bfl" x2="0" y2="1"><stop stop-color="#b6b7ad"/><stop offset="1" stop-color="#92968d"/></linearGradient></defs><rect width="960" height="600" fill="url(#btile)"/><g stroke="#c0c5bd" stroke-width="2"><path d="M0 120H960M0 240H960M0 360H960M0 480H960M160 0V480M320 0V480M480 0V480M640 0V480M800 0V480"/></g><rect y="480" width="960" height="120" fill="url(#bfl)"/><path d="M0 480H960" stroke="#888e84" stroke-width="5"/><rect x="110" y="70" width="420" height="270" rx="8" fill="#8f928a"/><rect x="123" y="83" width="394" height="244" rx="4" fill="url(#mirror)"/><path d="M320 84V326" stroke="#b7c2bf" stroke-width="3"/><path d="M150 115Q260 95 350 115" stroke="#fff" stroke-width="7" opacity=".2" fill="none"/><rect x="65" y="345" width="520" height="34" rx="5" fill="#a18d76"/><rect x="85" y="379" width="480" height="112" rx="5" fill="#d8d2c7"/><rect x="110" y="392" width="200" height="86" fill="#c5beb2"/><rect x="330" y="392" width="210" height="86" fill="#c5beb2"/><path d="M110 430H310M330 430H540" stroke="#a69b8c" stroke-width="3"/><ellipse cx="322" cy="352" rx="125" ry="22" fill="#f4f1e9"/><path d="M230 350Q322 322 414 350Q410 380 322 382Q235 380 230 350Z" fill="#e9e8e0" stroke="#aab0a8" stroke-width="3"/><path d="M320 345V324Q320 306 340 306" stroke="#9c9f97" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M339 306h30" stroke="#9c9f97" stroke-width="8" stroke-linecap="round"/><rect x="670" y="80" width="190" height="300" rx="6" fill="#a18e77"/><rect x="685" y="95" width="160" height="270" fill="#e3ddd1"/><path d="M685 185H845M685 275H845" stroke="#a18e77" stroke-width="7"/><rect x="710" y="120" width="50" height="55" rx="5" fill="#b9c3b6"/><rect x="775" y="128" width="45" height="47" rx="5" fill="#d8d0c2"/><rect x="710" y="205" width="110" height="60" rx="5" fill="#d2c8b8"/><rect x="720" y="290" width="90" height="60" rx="5" fill="#aeb8b1"/><rect x="80" y="25" width="230" height="18" rx="5" fill="#9d8b75"/><path d="M95 43V110M295 43V110" stroke="#a48f77" stroke-width="7"/><path d="M110 110Q195 150 280 110" fill="none" stroke="#e9e1d4" stroke-width="18"/><rect x="875" y="120" width="50" height="350" rx="5" fill="#c6b9a5"/><path d="M883 140H916M883 160H916" stroke="#e8e0d4" stroke-width="4"/></svg>`;
function hot(id,label,x,y,w,h){return '<button class="hotspot" style="left:'+x+'%;top:'+y+'%;width:'+w+'%;height:'+h+'%" data-object="'+id+'" aria-label="'+label+'"><span>'+label+'</span></button>'}
function render(){const room=S.room;$("roomTitle").textContent=room==="bedroom"?"臥室":"浴室";$("chapter").textContent=room==="bedroom"?"CHAPTER 01":"CHAPTER 02";$("roomSub").textContent=room==="bedroom"?"雨天清晨 · 頭痛欲裂":"洗手台前 · 鏡面留著痕跡";let art=room==="bedroom"?bedroomArt:bathArt;let spots=room==="bedroom"?hot("window","窗戶",7,9,29,46)+hot("bed","床鋪",21,50,51,37)+hot("clock","舊機械鐘",78,54,8,11)+hot("nightstand","床頭櫃",75,60,17,27)+hot("closet","衣櫃",89,25,8,47)+hot("notebook","筆記本",40,77,12,12)+hot("door","房門",91,0,8,30):hot("mirror","浴室鏡子",12,12,43,47)+hot("sink","洗手台與水龍頭",21,54,32,15)+hot("cabinet","洗手台下櫃",9,64,51,18)+hot("towel","毛巾",7,0,25,22)+hot("shelf","收納架",69,14,21,55)+hot("door","回臥室",90,18,9,60);$("sceneWrap").innerHTML=art+spots;document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>interact(b.dataset.object));$("progress").textContent="已發現線索："+S.clues.length;$("sceneCaption").textContent=room==="bedroom"?"雨聲持續落在窗外。點擊物件進行調查；機械鐘可進入近距離操作。":"水龍頭、鏡子與日常用品都可以調查。梳洗不是解謎的必要順序。"}
function enter(){S=structuredClone(initial);$("title").classList.add("hidden");$("header").classList.remove("hidden");$("game").classList.remove("hidden");render();say("醒來","頭痛像有人拿鐵鎚敲著太陽穴。林敬偉睜開眼，窗外的雨還沒停。\n\n他下意識把手伸向枕頭底下。空的。\n\n房間很熟悉，只是有些東西的位置，好像跟記憶裡不太一樣。")}
function interact(id){if(S.room==="bedroom"){if(id==="clock")clock();if(id==="nightstand"){if(S.drawerOpen){modal("床頭櫃暗格","暗格已經打開，裡面只剩下便利貼留下的壓痕。");}else say("床頭櫃","抽屜像是卡住了。櫃面有一圈長年摩擦留下的痕跡。\n\n你試著拉了拉，沒有動靜。也許要先找到讓暗格開啟的方法。")}if(id==="bed")modal("床鋪","身體沉得像灌了鉛。枕頭底下空無一物。頭痛沒有消失，只是躺著時稍微沒那麼尖銳。",[{label:"坐起身",primary:true,fn:()=>{closeModal();say("床沿","你扶著床沿坐起來，等那陣暈眩稍微退去。")}}]);if(id==="window"){clue("rain","窗外雨勢很大。玻璃映出房間裡的輪廓，雨水讓倒影微微晃動。");say("窗戶","雨水沿著玻璃往下滑。外頭的街景被雨模糊了，你一時想不起今天是星期幾。")}if(id==="closet")say("衣櫃","深色衣物整齊掛著。最外側的黑色外套帶著淡淡的雨氣。你暫時想不起上次穿它是什麼時候。");if(id==="notebook")journal();if(id==="door"){S.room="bathroom";render();say("走進浴室","頭痛讓你想洗把臉清醒一下。你扶著牆走進浴室，鏡面有些水痕，洗手台上放著日常用品。")}}
else{if(id==="mirror")mirror();if(id==="sink")sink();if(id==="cabinet")say("洗手台下櫃","櫃門沒有上鎖，只是卡得有點緊。裡面放著清潔用品與備品。");if(id==="towel"){clue("towel","毛巾架上有兩條毛巾。一條摺得整齊，另一條還濕著，像剛有人用過。");say("毛巾架","兩條毛巾。一條整整齊齊，另一條濕了一角。你伸手碰了碰，水還沒乾。")}if(id==="shelf"){clue("shaving","收納架上有剃鬍泡沫，瓶身旁貼著一張小紙：「不要再刮傷自己了。」");say("浴室收納架","剃鬍泡沫旁貼著一張小紙：「不要再刮傷自己了。」語氣熟稔得像是說過很多次。")}if(id==="door"){S.room="bedroom";render();say("回到臥室","你擦乾手，回到臥室。雨聲還在，頭痛也還在。")}}persist()}
function clock(){modal("舊機械鐘","你把鐘翻過來，後蓋有四枚連動齒輪。金屬牌刻著入會日期：2021.05.18。\n\n齒輪旁刻著操作說明：轉動一枚，右側下一枚會反向跟著走。把四枚齒輪調整到日期的月、日：05／18。",[ {label:"檢查齒輪",primary:true,fn:()=>{closeModal();gearPuzzle()}}])}
function gearPuzzle(){let body=document.createElement("div");body.innerHTML='<p>目標排列：<strong>0　5　1　8</strong>。每轉動一枚齒輪，右側下一枚會反向轉動一格。</p><div class="gears" id="gears"></div><p id="gearHint" style="font-size:12px;color:#777165">四枚齒輪必須同時對齊，才能解除床頭櫃暗格的機關。</p>';modal("機械鐘齒輪",body,[{label:"確認排列",primary:true,fn:checkGears},{label:"重置齒輪",fn:()=>{S.gear=[3,2,4,6];drawGears()} }]);drawGears()}
function drawGears(){const el=$("gears");if(!el)return;el.innerHTML="";S.gear.forEach((n,i)=>{const d=document.createElement("div");d.className="gear";d.innerHTML='<div class="gear-wheel"><b>'+n+'</b></div><small>齒輪 '+(i+1)+'</small><button>轉動 ↻</button>';d.querySelector("button").onclick=()=>{S.gear[i]=(S.gear[i]+1)%10;if(i<3)S.gear[i+1]=(S.gear[i+1]+9)%10;drawGears();persist()};el.append(d)})}
function checkGears(){if(S.gear.join("")==="0518"){S.gearSolved=true;S.drawerOpen=true;clue("clock","四枚機械齒輪對齊 0518，床頭櫃暗格隨之彈開。");closeModal();modal("暗格彈開","齒輪發出沉悶的喀噠聲。床頭櫃的暗格滑了出來。\n\n裡面沒有槍，只有一張便利貼：\n\n「敬偉，頭痛記得吃藥！不要在那邊硬撐！」\n\n字跡熟悉，卻讓你一時想不起寫字的人。",[ {label:"收下便利貼",primary:true,fn:()=>{clue("note","便利貼寫著：「敬偉，頭痛記得吃藥！不要在那邊硬撐！」");closeModal();say("暗格裡的便利貼","你把便利貼收進筆記本。腦中閃過一個模糊的雨夜，槍聲、灼熱、有人在遠處喊你的名字。\n\n你分不清那是記憶，還是剛才才冒出的念頭。")} }]);persist()}else{$("gearHint").textContent="齒輪還沒有完全咬合。再觀察目前數字，調整後再確認。"}}
function sink(){modal("洗手台","水龍頭的金屬把手有冷凝的水珠。你可以自由梳洗，也可以轉開熱水。梳洗順序不影響解謎。",[ {label:"洗臉",fn:()=>{closeModal();say("洗臉","冷水碰上臉頰，刺得你縮了一下。視線清楚了一點，頭痛卻沒有退。")}},{label:"刷牙",fn:()=>{closeModal();clue("toothbrush","洗手台旁有兩支牙刷，其中一支刷毛已經散開。你不記得自己什麼時候開始準備兩支。");say("刷牙","牙刷旁邊似乎還有另一支。你盯著它看了幾秒，卻想不起來那支是誰的。")}},{label:"刮鬍子",fn:()=>{closeModal();say("刮鬍子","剃刀滑過下巴，你下意識放慢動作。鏡子裡的自己看起來比記憶中疲憊。")}},{label:"轉開熱水",primary:true,fn:()=>{closeModal();S.steam=true;say("熱水與水霧","你把洗手台的熱水打開。溫熱的水氣慢慢往上爬，鏡面從邊緣開始蒙白。\n\n水霧讓原本不明顯的痕跡逐漸浮現。",[ {label:"查看鏡子",primary:true,fn:mirror}]);persist()}}])}
function mirror(){if(!S.redSeen){S.redSeen=true;clue("redmark","鏡子角落有紅色奇異筆留下的筆畫。筆勢像是熟悉的人寫的，但敬偉不記得自己寫過。")}if(!S.steam){modal("浴室鏡子","鏡面角落有幾道紅色奇異筆筆畫。筆跡似乎被擦拭過，留下斷斷續續的痕跡。\n\n你靠近看，卻無法辨認完整內容。也許熱水蒸氣能讓另一層痕跡顯現。",[ {label:"回到洗手台",primary:true,fn:()=>{closeModal();sink()}}]);return}const body=document.createElement("div");body.innerHTML='<p>熱水蒸氣覆上鏡面後，原本看不清的地方浮出另一層痕跡。紅色筆畫與乾燥區域交疊，像是兩段不同時間留下的訊息。</p><div style="height:180px;border:1px solid #c8c2b7;border-radius:9px;background:linear-gradient(135deg,#dce3df,#f4f2ec);position:relative;display:grid;place-items:center;margin:14px 0"><div style="font:italic 30px serif;color:#a6534c;letter-spacing:.25em;transform:rotate(-4deg)">｜ 〢 〣 〤</div><div style="position:absolute;inset:15px;border:1px dashed #9da9a4;border-radius:6px;opacity:.7"></div><span style="position:absolute;bottom:8px;right:12px;font-size:10px;color:#777">鏡面水霧痕跡示意</span></div><p>目前可以確認：紅色痕跡與水霧顯現的痕跡不是同一時間留下。真正的筆畫對照方式仍需進一步調查。</p><p style="font-size:12px;color:#8a7b67">本版本先保留鏡面調查與水霧顯影；數字 4829 的正式推理機制尚未定案，不會用猜密碼取代推理。</p>';modal("鏡面上的兩層痕跡",body,[{label:"記下觀察",primary:true,fn:()=>{clue("mist","熱水蒸氣讓鏡面浮出另一層痕跡。紅色奇異筆與乾燥區域似乎分屬不同時間，對照方式尚未確認。");closeModal();say("鏡面痕跡","你把看到的內容記下來。\n\n有些事情明明就在眼前，卻像隔著一層霧，怎麼也看不清。")}}]);}
function journal(){const body=document.createElement("div");body.innerHTML='<ol class="journal">'+(S.notes.length?S.notes.map(x=>"<li>"+x+"</li>").join(""):"目前還沒有整理任何發現。")+'</ol>';modal("敬偉的筆記本",body)}
$("startBtn").onclick=enter;
$("journalBtn").onclick=journal;
$("saveBtn").onclick=()=>{persist();say("已存檔","目前進度已儲存在這台裝置的瀏覽器。")};
$("menuBtn").onclick=()=>modal("遊戲選單","回到標題或繼續目前的探索。存檔會保留在這台裝置的瀏覽器。",[{label:"回到標題",fn:()=>{closeModal();$("game").classList.add("hidden");$("header").classList.add("hidden");$("title").classList.remove("hidden")}}]);
if(S&&S.room){/* 進入遊戲仍由玩家按開始，避免自動跳過序章 */}
</script></body></html>
