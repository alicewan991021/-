<style>

.sidebar{padding:16px;display:flex;flex-direction:column;gap:13px}.sidebar h3{font:400 20px Georgia,serif;margin:0}.story{white-space:pre-line;font:15px/1.95 Georgia,"Noto Serif TC",serif;color:#575146;min-height:105px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button,.sidebtn{border:1px solid var(--line);background:#f8f2e8;border-radius:8px;padding:8px 10px;font-size:11px}.rule{height:1px;background:#e8dfd3}.small-label{font-size:10px;letter-spacing:.2em;color:#9a8465}.inventory{display:flex;gap:7px;flex-wrap:wrap;min-height:44px}.item{border:1px solid #d9cbb8;background:#f7f0e5;border-radius:8px;padding:7px 9px;font-size:11px}.item.selected{outline:2px solid #b18d5c;background:#eee1cc}.status{font-size:11px;line-height:1.8;color:#82796d}

<header id="header" class="hidden"><div><strong>記憶重生</strong> <small>MEMORY REBIRTH</small></div><div class="headtools"><button id="bagBtn">物品欄</button><button id="journalBtn">筆記本</button><button id="saveBtn">存檔</button><button id="menuBtn">選單</button></div></header>
<section id="title"><div class="cover"><div class="eyebrow">A STORY OF MEMORY AND LOVE</div><h1>記憶重生</h1><div class="sub">有些人忘了，有些事還在。</div><p>一個熟悉的家，一段逐漸模糊的生活。<br>當記憶開始出現落差，你還能相信眼前的一切嗎？</p><button class="primary" id="startBtn">開始探索</button><div class="hintline">自由移動 × 物品操作 × 劇情推理<br>臥室與浴室互動測試版</div></div></section>
<section id="game" class="hidden"><div class="scene-card"><div class="scene-top"><div><div class="chapter" id="chapter">CHAPTER 01</div><h2 id="roomTitle">臥室</h2></div><p id="roomSub">雨天清晨 · 06:18</p></div><div class="stage" id="stage"></div><div class="scene-bottom"><span id="sceneCaption">在房間內移動，靠近物件後調查。</span><span class="move-help">⌖ 點地面移動</span></div></div><aside class="sidebar"><div class="small-label">CURRENT MOMENT</div><h3 id="panelTitle">醒來</h3><div class="story" id="story"></div><div class="actions" id="actions"></div><div class="rule"></div><div class="small-label">物品欄</div><div class="inventory" id="inventory"></div><div class="rule"></div><div class="small-label">探索紀錄</div><div class="status" id="progress">尚未發現線索</div><div class="status">移動：點擊地面／拖曳方向控制（鍵盤可用方向鍵或 WASD）。靠近物件後點擊調查。</div></aside></section></div>

<script>
const $=id=>document.getElementById(id);
const fresh={room:"bedroom",pos:{x:43,y:78},gear:[3,2,4,6],gearSolved:false,drawerOpen:false,steam:false,redSeen:false,notes:[],clues:[],items:[],visited:{bedroom:true}};
let S=load()||structuredClone(fresh),selectedItem=null,movingTimer=null;
function load(){try{return JSON.parse(localStorage.getItem("memoryRebirthV3"))}catch(e){return null}}
function save(){localStorage.setItem("memoryRebirthV3",JSON.stringify(S))}
function say(t,s,acts=[]){$("panelTitle").textContent=t;$("story").textContent=s;$("actions").innerHTML="";acts.forEach(a=>{let b=document.createElement("button");b.textContent=a.label;if(a.primary)b.className="primary";b.onclick=a.fn;$("actions").append(b)})}
function addClue(id,text){if(!S.clues.includes(id)){S.clues.push(id);S.notes.push(text);save();updateStatus()}}
function addItem(id,label,desc){if(!S.items.some(x=>x.id===id)){S.items.push({id,label,desc});save();renderInventory()}}
function updateStatus(){$("progress").textContent="已發現 "+S.clues.length+" 條線索 · 已收集 "+S.items.length+" 件物品"}
function modal(title,content,acts=[]){$("modalCard").innerHTML='<div class="modal-head"><h3>'+title+'</h3><button id="closeModal">×</button></div><div class="modal-body" id="modalBody"></div>';$("modal").classList.remove("hidden");$("modalBody").append(content);let row=document.createElement("div");row.className="modal-actions";acts.forEach(a=>{let b=document.createElement("button");b.textContent=a.label;if(a.primary)b.className="primary";b.onclick=a.fn;row.append(b)});$("modalBody").append(row);$("closeModal").onclick=closeModal}
function closeModal(){$("modal").classList.add("hidden")}
function paragraph(s){let p=document.createElement("p");p.textContent=s;return p}
function renderInventory(){$("inventory").innerHTML="";if(!S.items.length){$("inventory").textContent="目前沒有物品";return}S.items.forEach(it=>{let b=document.createElement("button");b.className="item"+(selectedItem===it.id?" selected":"");b.textContent=it.label;b.onclick=()=>itemDetail(it);$("inventory").append(b)})}
function itemDetail(it){let d=document.createElement("div");d.append(paragraph(it.desc));modal(it.label,d,[{label:"收起",primary:true,fn:closeModal}])}

function render(){let room=S.room,stage=$("stage");$("roomTitle").textContent=room==="bedroom"?"臥室":"浴室";$("chapter").textContent=room==="bedroom"?"CHAPTER 01":"CHAPTER 02";$("roomSub").textContent=room==="bedroom"?"雨天清晨 · 06:18":"洗手台前 · 霧氣未散";$("sceneCaption").textContent="在場景中自由移動，靠近物件後點擊調查。";stage.innerHTML=(room==="bedroom"?bedroom:bathroom)+'<div class="player" id="player"><i class="head"></i><i class="hair"></i><i class="body"></i><i class="leg l"></i><i class="leg r"></i></div><div class="stage-hint">點擊地面移動 · 靠近物件後調查</div>';spots[room].forEach(([id,label,x,y,w,h])=>{let b=document.createElement("button");b.className="hotspot";b.dataset.id=id;b.dataset.label=label;b.style.cssText="left:"+x+"%;top:"+y+"%;width:"+w+"%;height:"+h+"%";b.onclick=()=>approach(id,x,y);stage.append(b)});setPos(S.pos.x,S.pos.y);stage.onclick=e=>{if(e.target.closest(".hotspot"))return;let r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(y>45)setPos(Math.max(5,Math.min(95,x)),Math.max(54,Math.min(91,y)))};renderInventory();updateStatus();nearby()}
function setPos(x,y){S.pos={x,y};let p=$("player");if(p){p.style.left=x+"%";p.style.top=y+"%";p.classList.add("moving");clearTimeout(movingTimer);movingTimer=setTimeout(()=>p.classList.remove("moving"),390)}nearby();save()}
function nearby(){if(!$("stage"))return;document.querySelectorAll(".hotspot").forEach(b=>{let x=parseFloat(b.style.left),y=parseFloat(b.style.top),near=Math.hypot((x-S.pos.x)*.8,y-S.pos.y)<19;b.classList.toggle("near",near)})}
function approach(id,x,y){setPos(Math.max(5,Math.min(95,x)),Math.max(52,Math.min(90,y)));setTimeout(()=>interact(id),220)}
function moveBy(dx,dy){setPos(Math.max(4,Math.min(96,S.pos.x+dx)),Math.max(52,Math.min(92,S.pos.y+dy)))}
document.addEventListener("keydown",e=>{if($("game").classList.contains("hidden")||!$("modal").classList.contains("hidden"))return;let k=e.key.toLowerCase(),d={arrowleft:[-3,0],a:[-3,0],arrowright:[3,0],d:[3,0],arrowup:[0,-3],w:[0,-3],arrowdown:[0,3],s:[0,3]}[k];if(d){e.preventDefault();moveBy(...d)}});
function start(){if(!S||!S.room)S=structuredClone(fresh);$("title").classList.add("hidden");$("header").classList.remove("hidden");$("game").classList.remove("hidden");render();say("醒來","頭痛像有人拿鐵鎚敲著太陽穴。林敬偉睜開眼，窗外的雨還沒停。\n\n他下意識把手伸向枕頭底下。空的。\n\n房間很熟悉，只是有些東西的位置，好像跟記憶裡不太一樣。")}
function interact(id){if(S.room==="bedroom"){if(id==="clock")clock();if(id==="nightstand"){if(S.drawerOpen){let d=document.createElement("div");d.append(paragraph("暗格已經打開，裡面只剩下便利貼留下的壓痕。"));modal("床頭櫃暗格",d)}else say("床頭櫃","抽屜像是卡住了。櫃面有一圈長年摩擦留下的痕跡。也許要先找到讓暗格開啟的方法。")}if(id==="bed")say("床鋪","身體沉得像灌了鉛。枕頭底下空無一物。頭痛沒有消失，只是躺著時稍微沒那麼尖銳。",[ {label:"坐起身",primary:true,fn:()=>say("床沿","你扶著床沿坐起來，等那陣暈眩稍微退去。")}]);if(id==="window"){addClue("rain","窗外雨勢很大。玻璃映出房間裡的輪廓，雨水讓倒影微微晃動。");say("窗戶","雨水沿著玻璃往下滑。外頭的街景被雨模糊了，你一時想不起今天是星期幾。")}if(id==="wardrobe")say("衣櫃","深色衣物整齊掛著。最外側的黑色外套帶著淡淡的雨氣。你暫時想不起上次穿它是什麼時候。");if(id==="notebook")journal();if(id==="door"){S.room="bathroom";S.pos={x:9,y:78};S.visited.bathroom=true;render();say("走進浴室","頭痛讓你想洗把臉清醒一下。你扶著牆走進浴室，鏡面有些水痕，洗手台上放著日常用品。")}}
else{if(id==="mirror")mirror();if(id==="sink")sink();if(id==="cabinet")say("洗手台下櫃","櫃門沒有上鎖，只是卡得有點緊。裡面放著清潔用品與備品。");if(id==="towel"){addClue("towel","毛巾架上有兩條毛巾。一條摺得整齊，另一條還濕著，像剛有人用過。");say("毛巾架","兩條毛巾。一條整整齊齊，另一條濕了一角。你伸手碰了碰，水還沒乾。")}if(id==="shelf"){addClue("shaving","收納架上有剃鬍泡沫，瓶身旁貼著一張小紙：「不要再刮傷自己了。」");say("浴室收納架","剃鬍泡沫旁貼著一張小紙：「不要再刮傷自己了。」語氣熟稔得像是說過很多次。")}if(id==="door"){S.room="bedroom";S.pos={x:9,y:70};render();say("回到臥室","你擦乾手，回到臥室。雨聲還在，頭痛也還在。")}}save()}
function clock(){let d=document.createElement("div");d.append(paragraph("你把鐘翻過來，後蓋有四枚連動齒輪。金屬牌刻著入會日期：05／18。"));d.append(paragraph("齒輪旁刻著操作說明：轉動一枚，右側下一枚會反向跟著走。將四枚齒輪調整成 0、5、1、8。"));modal("舊機械鐘",d,[{label:"打開後蓋",primary:true,fn:gearPuzzle}])}
function gearPuzzle(){let d=document.createElement("div");d.innerHTML='<p>觀察齒輪數字，點擊旋鈕調整。轉動一枚時，右側相鄰齒輪會反向轉動一格。</p><div class="gear-grid" id="gearGrid"></div><p id="gearMsg" style="font-size:12px;color:#817562">目標排列：0　5　1　8</p>';modal("四枚連動齒輪",d,[{label:"確認機關",primary:true,fn:checkGear},{label:"重置",fn:()=>{S.gear=[3,2,4,6];drawGear()}}]);drawGear()}
function drawGear(){let el=$("gearGrid");if(!el)return;el.innerHTML="";S.gear.forEach((v,i)=>{let c=document.createElement("div");c.className="gear";c.innerHTML='<div class="wheel"><b>'+v+'</b></div><small>齒輪 '+(i+1)+'</small><button>轉動 ↻</button>';c.querySelector("button").onclick=()=>{S.gear[i]=(S.gear[i]+1)%10;if(i<3)S.gear[i+1]=(S.gear[i+1]+9)%10;drawGear();save()};el.append(c)})}
function checkGear(){if(S.gear.join("")==="0518"){S.gearSolved=true;S.drawerOpen=true;addClue("clock","四枚機械齒輪對齊 0518，床頭櫃暗格隨之彈開。");let d=document.createElement("div");d.append(paragraph("齒輪發出沉悶的喀噠聲。床頭櫃的暗格滑了出來。"));d.append(paragraph("裡面沒有槍，只有一張便利貼："));d.append(paragraph("「敬偉，頭痛記得吃藥！不要在那邊硬撐！」"));d.append(paragraph("字跡熟悉，卻讓你一時想不起寫字的人。"));modal("暗格彈開",d,[{label:"收下便利貼",primary:true,fn:()=>{addItem("note","東翰的便利貼","「敬偉，頭痛記得吃藥！不要在那邊硬撐！」字跡熟悉，卻讓你一時想不起寫字的人。");addClue("note","便利貼提醒敬偉頭痛時要吃藥，不要硬撐。");closeModal();say("暗格裡的便利貼","你把便利貼收進口袋。腦中閃過一個模糊的雨夜，槍聲、灼熱、有人在遠處喊你的名字。\n\n你分不清那是記憶，還是剛才才冒出的念頭。")}}]);}else{$("gearMsg").textContent="齒輪還沒有完全咬合。觀察目前數字，調整後再確認。"}}
function sink(){let d=document.createElement("div");d.append(paragraph("水龍頭的金屬把手有冷凝的水珠。你可以自由梳洗，也可以轉開熱水。梳洗順序不影響解謎。"));modal("洗手台",d,[{label:"洗臉",fn:()=>{closeModal();say("洗臉","冷水碰上臉頰，刺得你縮了一下。視線清楚了一點，頭痛卻沒有退。")}},{label:"刷牙",fn:()=>{closeModal();addClue("toothbrush","洗手台旁有兩支牙刷，其中一支刷毛已經散開。");say("刷牙","牙刷旁邊似乎還有另一支。你盯著它看了幾秒，卻想不起來那支是誰的。")}},{label:"刮鬍子",fn:()=>{closeModal();say("刮鬍子","剃刀滑過下巴，你下意識放慢動作。鏡子裡的自己看起來比記憶中疲憊。")}},{label:"轉開熱水",primary:true,fn:()=>{closeModal();S.steam=true;save();say("熱水與水霧","你把洗手台的熱水打開。溫熱的水氣慢慢往上爬，鏡面從邊緣開始蒙白。\n\n水霧讓原本不明顯的痕跡逐漸浮現。",[ {label:"查看鏡子",primary:true,fn:mirror}])}}])}
function mirror(){if(!S.redSeen){S.redSeen=true;addClue("redmark","鏡子角落有紅色奇異筆留下的筆畫。筆勢像是熟悉的人寫的，但敬偉不記得自己寫過。")}let d=document.createElement("div");if(!S.steam){d.append(paragraph("鏡面角落有幾道紅色奇異筆筆畫。筆跡似乎被擦拭過，留下斷斷續續的痕跡。"));d.append(paragraph("你靠近看，卻無法辨認完整內容。也許熱水蒸氣能讓另一層痕跡顯現。"));modal("浴室鏡子",d,[{label:"回到洗手台",primary:true,fn:sink}]);return}d.append(paragraph("熱水蒸氣覆上鏡面後，原本看不清的地方浮出另一層痕跡。紅色筆畫與乾燥區域交疊，像是兩段不同時間留下的訊息。"));let sample=document.createElement("div");sample.style.cssText="height:150px;border:1px solid #c9d0c9;border-radius:10px;background:linear-gradient(135deg,#dce4df,#f2f2eb);display:grid;place-items:center;margin:14px 0;color:#9b625a;font:italic 30px Georgia;letter-spacing:.3em";sample.textContent="｜ 〢 〣 〤";d.append(sample);d.append(paragraph("目前可以確認：紅色痕跡與水霧顯現的痕跡不是同一時間留下。正式數字推理機制尚待設計，不用猜密碼取代推理。"));modal("鏡面上的兩層痕跡",d,[{label:"記下觀察",primary:true,fn:()=>{addClue("mist","熱水蒸氣讓鏡面浮出另一層痕跡。紅色奇異筆與乾燥區域似乎分屬不同時間。");closeModal();say("鏡面痕跡","你把看到的內容記下來。\n\n有些事情明明就在眼前，卻像隔著一層霧，怎麼也看不清。")}}])}
function journal(){let d=document.createElement("div");if(!S.notes.length)d.append(paragraph("目前還沒有整理任何發現。"));else{let ol=document.createElement("ol");ol.className="journal";S.notes.forEach(n=>{let li=document.createElement("li");li.textContent=n;ol.append(li)});d.append(ol)}modal("敬偉的筆記本",d)}
function bag(){let d=document.createElement("div");if(!S.items.length)d.append(paragraph("口袋裡還沒有收集到物品。"));S.items.forEach(it=>{let b=document.createElement("button");b.className="item";b.style.margin="4px";b.textContent=it.label;b.onclick=()=>itemDetail(it);d.append(b)});modal("物品欄",d)}
$("startBtn").onclick=start;$("bagBtn").onclick=bag;$("journalBtn").onclick=journal;$("saveBtn").onclick=()=>{save();say("已存檔","目前進度已儲存在這台裝置的瀏覽器。")};$("menuBtn").onclick=()=>{let d=document.createElement("div");d.append(paragraph("目前探索進度會保存在這台裝置的瀏覽器。"));modal("遊戲選單",d,[{label:"回到標題",fn:()=>{closeModal();$("game").classList.add("hidden");$("header").classList.add("hidden");$("title").classList.remove("hidden")}}])};
</script></body></html>
