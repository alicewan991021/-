<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201d1b"><title>記憶重生｜臥室試玩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171614;color:#f5ead9;font-family:system-ui,"Noto Sans TC",sans-serif}button{font:inherit;color:inherit;cursor:pointer}#app{max-width:1200px;margin:auto;min-height:100svh;background:#24201d;display:flex;flex-direction:column}.top{height:54px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#211d1a;border-bottom:1px solid #554536}.brand{font:22px Georgia;letter-spacing:.18em}.brand small{font:10px system-ui;letter-spacing:.2em;color:#b9a88e}.top button,.tools button{background:#342d27;border:1px solid #76614b;border-radius:8px;padding:8px 12px;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;padding:12px;flex:1}.scene{position:relative;overflow:hidden;min-height:540px;border:1px solid #705a43;border-radius:12px;background:linear-gradient(#4a4240 0 55%,#6e5945 55% 100%);isolation:isolate}.backwall{position:absolute;inset:0 0 32% 0;background:linear-gradient(110deg,#55463e,#7b6250 48%,#493d37);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);z-index:-4}.floor{position:absolute;inset:56% -10% -10%;background:repeating-linear-gradient(90deg,transparent 0 95px,#4b392d22 96px 98px),repeating-linear-gradient(0deg,#98795b 0 58px,#765b43 59px 61px);transform:perspective(500px) rotateX(10deg);transform-origin:top;z-index:-3}.window{position:absolute;left:35%;top:7%;width:34%;height:42%;border:12px solid #47372d;background:linear-gradient(150deg,#1d3441,#536575 65%,#263542);box-shadow:0 0 0 3px #b79a70,inset 0 0 40px #101820}.window:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 35px,#c7d4d455 36px 38px),linear-gradient(90deg,transparent 49%,#bba78c 50% 51%,transparent 52%),linear-gradient(0deg,transparent 49%,#bba78c 50% 51%,transparent 52%)}.curtain{position:absolute;top:4%;height:49%;width:7%;background:linear-gradient(90deg,#b7a38b,#76634f);z-index:1;box-shadow:inset -8px 0 12px #33271e55}.curtain.left{left:31%}.curtain.right{left:68%}.bed{position:absolute;left:2%;bottom:15%;width:47%;height:39%;z-index:2;filter:drop-shadow(0 20px 10px #17110d88)}.headboard{position:absolute;left:2%;top:0;width:96%;height:38%;border-radius:18px 18px 4px 4px;background:linear-gradient(90deg,#3e3939,#655958,#393436);border:5px solid #493b34}.mattress{position:absolute;left:0;right:0;top:28%;height:65%;border-radius:18px;background:linear-gradient(145deg,#eee2d0,#b8a994);transform:skewY(-3deg);box-shadow:inset 0 -14px 0 #9c8873}.blanket{position:absolute;left:35%;top:42%;width:65%;height:52%;border-radius:10px;background:repeating-linear-gradient(0deg,#6d6670 0 14px,#8b8185 15px 17px);transform:skewY(-4deg);box-shadow:inset 0 0 25px #27242a55}.pillow{position:absolute;top:34%;left:9%;width:26%;height:21%;border-radius:15px;background:#e8dfd0;transform:rotate(-7deg);box-shadow:3px 7px 10px #4b403344}.nightstand{position:absolute;left:4%;bottom:6%;width:18%;height:22%;z-index:4;background:linear-gradient(90deg,#543c2c,#89694a);border:4px solid #493629;box-shadow:8px 12px 12px #17110d77}.nightstand:before{content:"";position:absolute;left:8%;right:8%;top:20%;height:30%;border:2px solid #b08d65;background:#72543a}.lamp{position:absolute;left:7%;bottom:28%;width:9%;height:18%;z-index:5}.lamp:before{content:"";position:absolute;left:0;top:0;width:100%;height:40%;background:#e6c89b;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%);filter:drop-shadow(0 0 18px #f2c987)}.lamp:after{content:"";position:absolute;left:47%;top:38%;height:60%;width:6%;background:#9d8465}.wardrobe{position:absolute;right:4%;top:12%;width:19%;height:58%;background:linear-gradient(90deg,#574333,#8d7051,#594332);border:6px solid #49372b;box-shadow:inset 5px 0 #b18c62,inset -5px 0 #3c2d24;z-index:1}.wardrobe:after{content:"";position:absolute;left:49%;top:5%;bottom:5%;border-left:3px solid #4a3527}.desk{position:absolute;left:38%;bottom:28%;width:34%;height:8%;background:linear-gradient(#b38c62,#62472f);z-index:2;box-shadow:0 10px 0 #493628}.desk:after{content:"";position:absolute;left:8%;right:8%;top:100%;height:90px;background:linear-gradient(90deg,#57402f 0 8%,transparent 8% 92%,#57402f 92%);}.bookshelf{position:absolute;right:25%;top:16%;width:12%;height:42%;background:#503b2d;border:5px solid #49362a;z-index:1}.bookshelf:before,.bookshelf:after{content:"";position:absolute;left:0;right:0;height:5px;background:#b08a5e}.bookshelf:before{top:33%}.bookshelf:after{top:66%}.rug{position:absolute;left:30%;bottom:3%;width:45%;height:20%;background:repeating-linear-gradient(90deg,#8c7963 0 18px,#a38e75 19px 21px);transform:skewX(-15deg);opacity:.8;z-index:0}.door{position:absolute;right:1%;bottom:23%;width:8%;height:38%;background:linear-gradient(90deg,#493327,#78573e);border:5px solid #3b2a20;z-index:2}.door:after{content:"";position:absolute;right:12%;top:50%;width:7px;height:7px;border-radius:50%;background:#d5b77e}.plant{position:absolute;left:28%;top:26%;width:7%;height:20%;z-index:2}.plant:before{content:"";position:absolute;bottom:0;left:25%;width:55%;height:38%;background:#8b7154;clip-path:polygon(10% 0,90% 0,75% 100%,25% 100%)}.plant:after{content:"";position:absolute;left:0;top:0;width:100%;height:75%;background:radial-gradient(ellipse at 30% 70%,#54704e 0 25%,transparent 27%),radial-gradient(ellipse at 70% 30%,#71815b 0 25%,transparent 27%),radial-gradient(ellipse at 50% 50%,#3f6048 0 34%,transparent 36%)}.player{position:absolute;left:48%;top:70%;width:34px;height:100px;z-index:8;transform:translate(-50%,-90%);filter:drop-shadow(0 8px 5px #160f0a99);transition:left .18s,top .18s}.player .hair{position:absolute;top:0;left:9px;width:18px;height:20px;background:#24201f;border-radius:50% 50% 35% 35%}.player .face{position:absolute;top:8px;left:11px;width:14px;height:16px;border-radius:45%;background:#d8b69b}.player .coat{position:absolute;top:22px;left:3px;width:28px;height:44px;border-radius:8px 8px 4px 4px;background:linear-gradient(90deg,#35383c,#737477,#35383c)}.player .legs{position:absolute;top:62px;left:7px;width:8px;height:32px;background:#28282a;box-shadow:12px 0 #28282a}.spot{position:absolute;z-index:7;border:1px solid #e9c99499;border-radius:10px;background:#211b16a8;color:#f7e5c5;padding:6px 9px;font-size:11px;box-shadow:0 0 15px #e5b77a44}.spot.active{outline:2px solid #f5d69b;background:#604c35}.spot:disabled{opacity:.4}.hud{position:absolute;left:10px;top:10px;z-index:10;background:#211d1bdc;border:1px solid #8c7254;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.7}.side{background:#29231f;border:1px solid #66513d;border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:12px}.side h2{font:22px Georgia;margin:0}.muted{font-size:11px;color:#b9a991}.dialog{font:14px/1.9 Georgia,"Noto Sans TC";min-height:110px;color:#eee1ce}.tools{display:flex;flex-wrap:wrap;gap:7px}.tools button{flex:1}.inventory{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;border:1px solid #80694d;border-radius:7px;padding:6px 8px;background:#382f27}.move{display:grid;grid-template-columns:repeat(3,42px);gap:4px;justify-content:center}.move button{height:38px;background:#40352b;border:1px solid #80694d;border-radius:8px}.move button:nth-child(1){grid-column:2}.move button:nth-child(2){grid-column:1;grid-row:2}.move button:nth-child(3){grid-column:2;grid-row:2}.move button:nth-child(4){grid-column:3;grid-row:2}.overlay{position:fixed;inset:0;background:#100e0ddd;display:grid;place-items:center;padding:15px;z-index:20}.panel{width:min(560px,100%);background:#302821;border:1px solid #a1855d;border-radius:13px;padding:20px;box-shadow:0 20px 60px #0009}.panel h2{font:24px Georgia;margin:0 0 12px}.panel p{line-height:1.9;color:#e7d9c4}.panel button{background:#554331;border:1px solid #a88a5c;border-radius:8px;padding:9px 13px;margin:4px}.wheels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.wheel{border:1px solid #8c7254;border-radius:10px;padding:10px;text-align:center}.wheel strong{display:block;font:30px Georgia;margin:5px}.wheel button{width:100%;margin:3px 0}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:7px}.scene{min-height:440px}.side{display:grid;grid-template-columns:1fr 1fr}.side .dialog{grid-column:1/-1}.scene .wardrobe{width:22%}.brand{font-size:18px}}@media(max-width:430px){.scene{min-height:420px}.side{display:flex}.spot{font-size:10px;padding:5px 7px}.top{padding:0 10px}}
</style></head><body><div id="app"><header class="top"><div class="brand">記憶重生 <small> MEMORY REBIRTH</small></div><div><button id="journal">筆記本</button> <button id="save">存檔</button></div></header>
<main class="layout"><section class="scene" id="scene"><div class="backwall"></div><div class="window"></div><div class="curtain left"></div><div class="curtain right"></div><div class="plant"></div><div class="wardrobe"></div><div class="bookshelf"></div><div class="desk"></div><div class="door"></div><div class="bed"><div class="headboard"></div><div class="mattress"></div><div class="pillow"></div><div class="blanket"></div></div><div class="nightstand"></div><div class="lamp"></div><div class="rug"></div><div class="floor"></div><div class="player" id="player"><i class="hair"></i><i class="face"></i><i class="coat"></i><i class="legs"></i></div><div class="hud">序章・醒來的房間<br>雨聲持續著……</div>
<button class="spot" style="left:18%;top:62%" data-id="bed">床鋪</button><button class="spot" style="left:13%;top:80%" data-id="night">床頭櫃</button><button class="spot" style="left:84%;top:52%" data-id="clock">機械鐘</button><button class="spot" style="left:86%;top:23%" data-id="wardrobe">衣櫃</button><button class="spot" style="left:52%;top:48%" data-id="desk">書桌</button><button class="spot" style="left:96%;top:68%" data-id="door">房門</button><div class="hud" style="top:auto;bottom:10px">點擊地面移動・靠近物件後調查</div></section>
<aside class="side"><div class="muted">CHAPTER 01 · 06:18 AM</div><h2 id="title">醒來</h2><div class="dialog" id="dialog">頭痛像有人拿鐵鎚敲著太陽穴。林敬偉睜開眼，窗外的雨還沒停。<br><br>他下意識把手伸向枕頭底下。空的。</div><div class="tools"><button id="inspect">調查附近</button><button id="bag">物品欄</button></div><div class="muted">隨身物品</div><div class="inventory" id="inventory">尚無物品</div><div class="muted">移動控制</div><div class="move"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><div class="muted">也可使用鍵盤方向鍵／WASD。手機請使用方向按鈕或點擊地面。</div></aside></main></div><div id="overlay" class="overlay hidden"><div class="panel" id="panel"></div></div>
<script>
const $=id=>document.getElementById(id);let p={x:48,y:73},found=[],items=[],near=null,gear=[3,2,4,6],drawer=false;
const spots={bed:[18,62],night:[13,80],clock:[84,52],wardrobe:[86,23],desk:[52,48],door:[96,68]};
function say(t,s){$('title').textContent=t;$('dialog').innerHTML=s}
function move(dx,dy){p.x=Math.max(5,Math.min(96,p.x+dx));p.y=Math.max(48,Math.min(91,p.y+dy));$('player').style.left=p.x+'%';$('player').style.top=p.y+'%';nearby()}
function nearby(){let best=1e9;near=null;document.querySelectorAll('.spot').forEach(b=>{let [x,y]=spots[b.dataset.id],d=Math.hypot((x-p.x)*.8,y-p.y);b.classList.toggle('active',d<19);if(d<best){best=d;near=b.dataset.id}})}
function go(id){let [x,y]=spots[id];p.x=x;p.y=Math.min(88,y+8);$('player').style.left=p.x+'%';$('player').style.top=p.y+'%';nearby();if(Math.hypot((x-p.x)*.8,y-p.y)<20)interact(id)}
function interact(id){if(id==='bed')say('床鋪','身體沉得像灌了鉛。枕頭底下空無一物。你確定自己平常會把某樣東西放在那裡。');if(id==='night')say('床頭櫃','抽屜有一道不自然的縫隙，像藏著暗格。需要先找到開啟方法。');if(id==='wardrobe')say('衣櫃','深色衣物整齊掛著。最外側的黑色外套帶著淡淡雨氣。');if(id==='desk')say('書桌','桌上有幾本書、一支筆，還有一本你常帶在身上的筆記本。');if(id==='door')say('房門','你握住門把，門沒有上鎖，但頭痛讓你遲疑了一下。');if(id==='clock')clock()}
function clock(){open('<h2>舊機械鐘</h2><p>你翻開鐘的後蓋，裡面有四枚連動齒輪。金屬牌刻著入會日期：05／18。轉動一枚齒輪，右側相鄰齒輪會反向轉動一格。請將排列調整為 0、5、1、8。</p><div class="wheels" id="wheels"></div><p id="gmsg">目前排列：'+gear.join(' ')+'</p><button onclick="check()">確認機關</button><button onclick="closePanel()">先離開</button>');draw()}
function draw(){let el=$('wheels');if(!el)return;el.innerHTML='';gear.forEach((v,i)=>{let d=document.createElement('div');d.className='wheel';d.innerHTML='<small>齒輪 '+(i+1)+'</small><strong>'+v+'</strong><button>轉動</button>';d.querySelector('button').onclick=()=>{gear[i]=(gear[i]+1)%10;if(i<3)gear[i+1]=(gear[i+1]+9)%10;draw()};el.append(d)})}
function check(){if(gear.join('')==='0518'){drawer=true;found.push('機械鐘齒輪排列為 0518');items.push('東翰的便利貼');closePanel();say('暗格彈開','齒輪發出沉悶的喀噠聲。床頭櫃暗格滑了出來。<br><br>裡面只有一張便利貼：「敬偉，頭痛記得吃藥！不要在那邊硬撐！」<br><br>字跡熟悉，卻讓你一時想不起寫字的人。');$('inventory').textContent=items.join('、')}else{$('gmsg').textContent='齒輪還沒有完全咬合，觀察數字後再調整。'}}
function open(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden')}function closePanel(){$('overlay').classList.add('hidden')}
$('scene').addEventListener('click',e=>{if(e.target.closest('.spot')){interact(e.target.dataset.id);return}let r=$('scene').getBoundingClientRect();let x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(y>45){p.x=x;p.y=y;$('player').style.left=x+'%';$('player').style.top=y+'%';nearby()}});
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{let d=b.dataset.move;move(d==='left'?-4:d==='right'?4:0,d==='up'?-3:d==='down'?3:0)}));
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),m={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'}[k];if(m){e.preventDefault();let d=m;move(d==='left'?-3:d==='right'?3:0,d==='up'?-3:d==='down'?3:0)}});

$('inspect').onclick=()=>{if(near)interact(near);else say('四處查看','房間裡很安靜，只聽得見窗外的雨聲。')};
$('bag').onclick=()=>open('<h2>物品欄</h2><p>'+(items.length?items.join('<br>'):'目前沒有物品。')+'</p><button onclick="closePanel()">關閉</button>');
$('journal').onclick=()=>open('<h2>敬偉的筆記本</h2><p>'+(found.length?found.join('<br><br>'):'目前還沒有紀錄。')+'</p><button onclick="closePanel()">關閉</button>');
$('save').onclick=()=>{localStorage.setItem('mr-preview',JSON.stringify({p,found,items,gear,drawer}));say('已存檔','目前進度已儲存在這台裝置的瀏覽器。')};
nearby();
</script></body></html>
